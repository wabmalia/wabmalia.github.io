<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#12152a">
  <title>Arcade: offline</title>
  <style>
    html, body { margin: 0; height: 100%; background: #12152a; color: #eef0fa;
                 font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; touch-action: manipulation; }
    body { display: flex; flex-direction: column; align-items: center; justify-content: center;
           gap: 20px; padding: 24px; box-sizing: border-box; text-align: center; }
    h1 { margin: 0; font: 900 28px/1.2 ui-monospace, monospace; letter-spacing: 2px; color: #f2b134; }
    p { margin: 0; color: #c0c4dc; max-width: 32em; line-height: 1.4; }
    button { font: inherit; font-weight: 700; color: #12152a; background: #f2b134; border: 0;
             border-radius: 10px; padding: 12px 28px; cursor: pointer; }
  </style>
</head>
<body>
  <h1>OFFLINE</h1>
  <p>The arcade needs a connection to load. Check your network and try again.</p>
  <button type="button" onclick="location.reload()">TRY AGAIN</button>
</body>
</html>
